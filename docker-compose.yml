services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitshuttle-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-in-production-super-secret-key-vit-2026
      - JWT_SECRET_KEY=change-in-production-jwt-super-secret-key-2026
      - CORS_ORIGINS=*
      - PORT=5000
    volumes:
      # Persistent SQLite and logs outside container storage
      - backend-data:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitshuttle-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
