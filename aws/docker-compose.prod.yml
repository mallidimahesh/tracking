services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vitshuttle-backend-prod
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # Persistent EBS volume directory on host
      - /opt/vit-shuttle/data:/app/instance
    networks:
      - transit-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: vitshuttle-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/vitshuttle:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - transit-net

networks:
  transit-net:
    driver: bridge
